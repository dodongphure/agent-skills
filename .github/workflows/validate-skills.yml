name: validate-skills

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate every skill
        run: |
          validator="skills/skill-authoring-standard/scripts/validate_skill.py"
          if [ ! -f "$validator" ]; then
            echo "::error::validator not found at $validator"
            exit 1
          fi

          status=0
          found=0
          for skill in skills/*/; do
            [ -f "${skill}SKILL.md" ] || continue
            found=$((found + 1))
            echo "::group::${skill}"
            python "$validator" "$skill" || status=1
            echo "::endgroup::"
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::no skills found under skills/"
            exit 1
          fi

          echo "validated $found skill(s)"
          exit "$status"

      # The structural validator only checks layout and frontmatter; the skill's
      # actual contract (renderer, feedback envelope, view manifests) lives in
      # its unit tests. Running them here is what stops a regression reaching
      # main - without it, a green CI said nothing about whether the code ran.
      - name: Run herdr-pr-flow unit tests
        run: python -m unittest discover -s skills/herdr-pr-flow/tests -v
